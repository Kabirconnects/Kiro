<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  :root {
    --body-dark: #2b2140;
    --body-main: #372a55;
    --accent: #7c5cff;
    --eye: #ffe66d;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  #stage {
    width: 100%;
    height: 100%;
    -webkit-app-region: no-drag;
    cursor: pointer;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  #stage:active #cat {
    transform: scale(0.96);
  }

  #cat {
    width: 84%;
    height: 84%;
    transform-origin: 50% 100%;
    animation: bob 2.4s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-6px) rotate(-1.5deg); }
  }

  .tail {
    transform-origin: 90% 90%;
    animation: swish 1.6s ease-in-out infinite;
  }
  @keyframes swish {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(14deg); }
  }

  .eye {
    animation: blink 4.5s infinite;
    transform-origin: center;
  }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.1); }
  }
</style>
</head>
<body>
  <div id="stage" title="Click Kiro to open the coding assistant">
    <svg id="cat" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="100" cy="150" rx="55" ry="40" fill="var(--body-dark)"/>
      <path class="tail" d="M150 160 Q195 150 185 105" stroke="var(--body-dark)" stroke-width="14" fill="none" stroke-linecap="round"/>
      <circle cx="100" cy="90" r="48" fill="var(--body-main)"/>
      <path d="M60 60 L48 20 L85 48 Z" fill="var(--body-main)"/>
      <path d="M140 60 L152 20 L115 48 Z" fill="var(--body-main)"/>
      <path d="M64 55 L56 32 L80 50 Z" fill="var(--accent)"/>
      <path d="M136 55 L144 32 L120 50 Z" fill="var(--accent)"/>
      <ellipse class="eye" cx="82" cy="92" rx="7" ry="9" fill="var(--eye)"/>
      <ellipse class="eye" cx="118" cy="92" rx="7" ry="9" fill="var(--eye)"/>
      <circle cx="82" cy="92" r="3" fill="#1a1428"/>
      <circle cx="118" cy="92" r="3" fill="#1a1428"/>
      <path d="M94 106 Q100 112 106 106" stroke="var(--eye)" stroke-width="3" fill="none" stroke-linecap="round"/>
      <line x1="55" y1="100" x2="25" y2="96" stroke="var(--accent)" stroke-width="2"/>
      <line x1="55" y1="108" x2="25" y2="110" stroke="var(--accent)" stroke-width="2"/>
      <line x1="145" y1="100" x2="175" y2="96" stroke="var(--accent)" stroke-width="2"/>
      <line x1="145" y1="108" x2="175" y2="110" stroke="var(--accent)" stroke-width="2"/>
    </svg>
  </div>
  <script src="skins.js"></script>
  <script src="cat-overlay.js"></script>
</body>
</html>
